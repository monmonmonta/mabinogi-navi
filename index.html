<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d2b"><title>マビノギ 生産ナビ Ver.2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#eaf1f6;background:#0d1722}*{box-sizing:border-box}body{margin:0}header{padding:20px 16px;background:linear-gradient(130deg,#1b4351,#182333);position:sticky;top:0;z-index:3}h1{font-size:21px;margin:0 0 5px}small,.muted{color:#a9becb}main{padding:14px 14px 105px;max-width:740px;margin:auto}.panel{background:#172735;border:1px solid #345062;border-radius:14px;padding:14px;margin:12px 0}.title{font-weight:700;font-size:16px;margin-bottom:8px}.meta{font-size:13px;color:#b8c8d3;line-height:1.8}.mini{font-size:12px;color:#a9bdc9;line-height:1.6}.warn{color:#ffd18a}.good{color:#7fe0d1}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.search,.edit,select,input[type=number]{background:#102333;color:#fff;border:1px solid #536c7d;border-radius:10px;padding:11px;font-size:16px}.search,.edit,select{width:100%}input[type=number]{width:94px}.btn{background:#21858b;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:700}.btn2{background:#30495b;color:white;border:0;border-radius:9px;padding:9px 12px}button{cursor:pointer}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#142534;border-top:1px solid #395368;padding:8px 2px max(12px,env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:transparent;color:#b1c3cf;font-size:12px;padding:8px 2px}nav button.active{color:#79e0d4;font-weight:700}main section[hidden]{display:none}h2{font-size:17px;margin:16px 0 8px}.tag{font-size:11px;color:#b8ece6;background:#244a58;border-radius:6px;padding:3px 7px}.line{border-top:1px solid #345062;padding:8px 0}.space{margin-top:12px}.count{color:#81d8cf;font-weight:bold}
</style></head><body><header><h1>⚒️ マビノギ 生産ナビ <small>Ver.2</small></h1><small>素材検索・製作・加工・在庫・メモ</small></header><main>
<section id="search"><input id="q" class="search" placeholder="🔎 素材・製作品を検索"><div id="results"></div></section>
<section id="craft" hidden><h2>🛠️ 製作ナビ</h2><select id="craftName"></select><div class="panel"><div class="row"><label>作りたい個数</label><input type="number" min="1" id="craftQty" value="1"></div><div id="craftResult"></div></div></section>
<section id="process" hidden><h2>🔩 加工計算</h2><select id="processName"></select><div class="panel"><div class="row"><label>作りたい個数</label><input type="number" min="1" id="processQty" value="10"></div><div id="processResult"></div></div><div class="panel"><div class="title">✏️ 加工レシピ編集</div><p class="mini">複数素材にも対応。1行に「素材名,必要数」を入力します。数字が不明なら空欄のまま保存できます。</p><label class="mini">材料（1行に1種類）</label><textarea id="ingredients" rows="5" class="edit" placeholder="生皮,10&#10;タンニンパウダー,4"></textarea><div class="row space"><label>1回の完成数</label><input type="number" min="1" id="yieldQty" placeholder="未確認"></div><div class="space"><button class="btn" id="saveRecipe">この加工レシピを保存</button></div><p class="mini">編集内容はこの端末に保存されます。公式確認済みの値を変更した場合は「ユーザー編集」と表示します。</p></div></section>
<section id="stock" hidden><h2>📦 在庫</h2><input id="stockQ" class="search" placeholder="素材名で絞り込み"><div id="stockResults"></div></section>
<section id="notes" hidden><h2>📚 メモ・データ管理</h2><div class="panel"><label>素材・製作品</label><select id="memoName"></select><textarea id="memo" class="edit space" rows="5" placeholder="入手場所やスキル効果など"></textarea><button id="saveMemo" class="btn space">メモを保存</button></div><div class="panel"><div class="title">バックアップ</div><p class="mini">在庫・メモ・加工レシピの編集内容をJSON形式で保存・復元できます。</p><button id="backup" class="btn">バックアップを保存</button><label class="btn2 space" style="display:inline-block">バックアップを読み込む<input type="file" id="restore" accept="application/json" hidden></label></div><div class="panel mini">レシピの「参考値」はゲーム内未確認です。ゲームで確認した数値を優先してください。空欄は推測で埋めません。</div></section>
</main><nav><button data-tab="search" class="active">🔎<br>検索</button><button data-tab="craft">⚒️<br>製作</button><button data-tab="process">🔩<br>加工</button><button data-tab="stock">📦<br>在庫</button><button data-tab="notes">📚<br>メモ</button></nav><script>
'use strict';
const C=[
['武器','ショートボウ','木工',1,'木材',3,'革',1,'装備Lv20'],['武器','コンポジットボウ','木工',3,'木材+',3,'革+',1,'装備Lv30'],['武器','ショートボウS','木工',6,'上級木材',4,'革+',2,'装備Lv40'],['武器','コンポジットボウS','木工',8,'上級木材',4,'上級革',2,'装備Lv50'],['武器','ローンエッジソード','鍛冶',1,'アイアンインゴット',2,'革',2,'装備Lv20'],['武器','クレセントエッジソード','鍛冶',3,'スチールインゴット',2,'革+',2,'装備Lv30'],['武器','ローンエッジソードS','鍛冶',6,'合金インゴット',3,'革+',3,'装備Lv40'],['武器','クレセントエッジソードS','鍛冶',8,'合金インゴット',3,'上級革',3,'装備Lv50'],
['料理','旅人のおやつ','料理',1,'卵',1,'肉',1,'HP50%アップ'],['料理','目玉焼き','料理',1,'卵',1,'塩',1,'HP50%アップ'],['料理','ゆで卵','料理',1,'卵',1,'水が入った瓶',1,'HP50%アップ'],['料理','焼いた肉','料理',1,'肉',4,'ハーブ',2,'塩',1,'STR・LUCK少しアップ'],['料理','肉のマヨネーズ炒め','料理',1,'肉',4,'キャベツ',1,'マヨネーズ',1,'STR・WILL少しアップ'],['料理','ポークインミルク','料理',5,'肉',8,'牛乳',4,'ニンニク',2,'ハーブ',2,'STR・LUCK少しアップ'],['料理','チーズフォンデュ','料理',5,'肉',8,'チーズ',2,'ジャガイモ',4,'塩',2,'STR・WILLアップ'],['料理','ジャガイモの丸焼き','料理',1,'ジャガイモ',4,'ハーブ',2,'砂糖',2,'DEX・LUCK少しアップ'],['料理','ポテトサラダ','料理',1,'ジャガイモ',4,'キャベツ',2,'マヨネーズ',1,'DEX・WILL少しアップ'],['料理','野菜炒め','料理',5,'ジャガイモ',8,'タマネギ',3,'キャベツ',6,'ハーブ',2,'DEX・LUCKアップ'],['料理','リコッタチーズサラダ','料理',5,'キャベツ',4,'チーズ',2,'マヨネーズ',1,'DEX・WILLアップ'],['料理','リンゴジュース','料理',1,'リンゴ',4,'ハーブ',2,'水が入った瓶',1,'砂糖',2,'INT・LUCKアップ'],['料理','リンゴサラダ','料理',1,'リンゴ',4,'キャベツ',2,'マヨネーズ',1,'INT・WILL少しアップ'],['料理','コーンチーズ','料理',5,'トウモロコシ',10,'チーズ',2,'ハーブ',2,'砂糖',3,'INT・LUCKアップ'],['料理','リンゴスフレ','料理',5,'リンゴ',8,'小麦粉',2,'卵',4,'砂糖',4,'INT・WILLアップ'],
['ポーション','回復ポーション','ポーション調合',null],['ポーション','包帯','ポーション調合',null],['道具','キャンプファイアキット','ハンディクラフト',null],['道具','生活道具（品名入力）','ハンディクラフト',null],['防具','重甲防具（品名入力）','重甲製作',null],['防具','軽甲防具（品名入力）','軽甲製作',null],['防具','布防具（品名入力）','裁縫',null],['アクセサリ','アクセサリ（品名入力）','ハンディクラフト',null]
];
const R={
'アイアンインゴット':{parts:[['鉱石',20]],yield:3,source:'ゲーム画面で確認済み'},
'鉄インゴット':{parts:[['鉄鉱石',null]],yield:null,source:'未確認（アイアンインゴットとの名称対応も要確認）'},
'スチール':{parts:[['鉄インゴット',null]],yield:null,source:'未確認'},'スチールインゴット':{parts:[],yield:null,source:'未確認'},'合金インゴット':{parts:[],yield:null,source:'未確認'},
'木材':{parts:[['丸太',null]],yield:null,source:'未確認'},'木材+':{parts:[],yield:null,source:'未確認'},'上級木材':{parts:[],yield:null,source:'未確認'},
'革':{parts:[['生皮',10]],yield:3,source:'ネット参考・要確認'},'革+':{parts:[['革',3],['タンニンパウダー',4]],yield:3,source:'ネット参考・要確認'},'上級革':{parts:[['革+',3],['上級生皮',15],['タンニンパウダー',8]],yield:3,source:'ネット参考・要確認'},
'生地':{parts:[['羊毛',10]],yield:3,source:'ネット参考・要確認'},'シルク':{parts:[['クモの糸',10]],yield:2,source:'ネット参考・要確認'},'生地+':{parts:[['生地',3],['羊毛',4]],yield:3,source:'ネット参考・要確認'},'上級生地':{parts:[['生地+',3],['上級羊毛',15],['羊毛',8]],yield:3,source:'ネット参考・要確認'},'上級シルク':{parts:[['シルク',4],['元気キノコのエキス',8]],yield:2,source:'ネット参考・要確認'}
};
const extras=['キャベツ','ジャガイモ','タマネギ','チーズ','トウモロコシ','ニンニク','ハーブ','マヨネーズ','リンゴ','丸太','卵','塩','小麦粉','水が入った瓶','牛乳','生皮','砂糖','羊毛','肉','鉄鉱石','クモの糸','タンニンパウダー','上級生皮','上級羊毛','元気キノコのエキス'];
const names=[...new Set([...extras,...Object.keys(R),...C.flatMap(r=>{let a=[];for(let i=4;i<r.length-1;i+=2)if(typeof r[i]==='string')a.push(r[i]);return a})])].sort((a,b)=>a.localeCompare(b,'ja'));
let saved={stock:{},memo:{},process:{}};try{const x=JSON.parse(localStorage.getItem('mabiDataV2')||localStorage.getItem('mabiDataV1')||'{}');if(x&&typeof x==='object')saved={stock:x.stock||{},memo:x.memo||{},process:x.process||{}}}catch(e){}
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const store=()=>localStorage.setItem('mabiDataV2',JSON.stringify(saved));const qty=id=>Math.max(1,Math.ceil(Number($(id).value)||1));const record=n=>saved.process[n]||R[n];
function partsOf(r){let p=[];for(let i=4;i<r.length-1;i+=2){if(typeof r[i]==='string'&&r[i])p.push([r[i],Number(r[i+1])||null])}return p}
function tab(id){document.querySelectorAll('main>section').forEach(x=>x.hidden=x.id!==id);document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id))}
function search(){let q=$('q').value.trim().toLowerCase();let found=C.filter(r=>r.join(' ').toLowerCase().includes(q));let mats=names.filter(n=>n.toLowerCase().includes(q));if(!q){found=found.slice(0,6);mats=mats.slice(0,12)}$('results').innerHTML='<p class="mini">'+(q?`${found.length+mats.length}件`:'登録データから検索')+'</p>'+found.map(r=>`<div class="panel"><div class="row"><b>${esc(r[1])}</b><span class="tag">${esc(r[0])}</span></div><div class="meta">${esc(r[2])} ／ Lv ${esc(r[3]??'未確認')}<br>${partsOf(r).map(p=>esc(p[0])+' × '+(p[1]??'未確認')).join('、')||'必要素材未登録'}</div><button class="btn2 space" onclick="openCraft(${C.indexOf(r)})">製作計算</button></div>`).join('')+mats.map(n=>`<div class="panel"><div class="row"><b>${esc(n)}</b><span class="tag">素材</span></div><div class="meta">在庫：${Number(saved.stock[n]||0)}個 ／ 加工：${record(n)?esc(record(n).source||'ユーザー編集'):'未登録'}</div></div>`).join('')}
function openCraft(i){$('craftName').value=i;tab('craft');craft()}
function plan(needs){const available={...saved.stock},raw={},steps=[],unknown=[],active=[];function consume(n,count){if(!Number.isFinite(count)||count<=0){unknown.push(n+'：必要数未確認');return}let stock=Math.max(0,Number(available[n])||0),used=Math.min(stock,count);available[n]=stock-used;let short=count-used;if(!short)return;let r=record(n);if(!r){raw[n]=(raw[n]||0)+short;return}if(active.includes(n)){unknown.push(n+'：循環レシピ');return}if(!Number.isInteger(r.yield)||r.yield<1||!r.parts?.length||r.parts.some(p=>!p[0]||!Number.isInteger(p[1])||p[1]<1)){unknown.push(n+'：加工数量未確認');raw[n]=(raw[n]||0)+short;return}let runs=Math.ceil(short/r.yield),produced=runs*r.yield;available[n]=(available[n]||0)+produced-short;steps.push({n,runs,produced,parts:r.parts.map(p=>[p[0],p[1]*runs]),source:r.source||'ユーザー編集'});active.push(n);for(const [pn,pq] of r.parts)consume(pn,pq*runs);active.pop()}
for(const [n,v] of needs)consume(n,v);return {raw,steps,unknown}}
function craft(){const r=C[Number($('craftName').value)],n=qty('craftQty');if(!r)return;let ps=partsOf(r),needs=ps.map(([name,count])=>[name,count===null?null:count*n]);let h=`<h2>${esc(r[1])} × ${n}個</h2><p class="meta">${esc(r[2])} ／ Lv ${esc(r[3]??'未確認')} ／ ${esc(r[r.length-1]||'詳細未確認')}</p><h2>必要素材・在庫との差</h2>`;h+=needs.length?needs.map(([name,count])=>`<div class="line row"><b>${esc(name)}</b><span class="meta">${count===null?'必要数未確認':`必要 ${count} ／ 在庫 ${Number(saved.stock[name]||0)} ／ <span class="count">不足 ${Math.max(0,count-Number(saved.stock[name]||0))}</span>`}</span></div>`).join(''):'<p class="warn">この製作品の素材レシピは未登録です。</p>';const p=plan(needs.filter(x=>x[1]!==null));h+='<h2>🔩 加工手順</h2>'+(p.steps.map(s=>`<div class="panel"><b>${esc(s.n)}：${s.runs}回加工 → ${s.produced}個</b><div class="meta">${s.parts.map(x=>esc(x[0])+' × '+x[1]).join('、')}</div><div class="mini">${esc(s.source)}</div></div>`).join('')||'<p class="mini">計算できる加工工程はありません。</p>');h+='<h2>🌿 採集・入手する素材</h2>'+(Object.entries(p.raw).map(([x,v])=>`<div class="line row"><b>${esc(x)}</b><span class="count">${v}個</span></div>`).join('')||'<p class="mini">計算できる不足原材料はありません。</p>');if(p.unknown.length||needs.some(x=>x[1]===null))h+='<p class="warn">⚠️ 未確認：'+[...new Set([...p.unknown,...needs.filter(x=>x[1]===null).map(x=>x[0]+'：必要数未確認')])].map(esc).join('、')+'。未確認の工程は原材料の総数を確定できません。</p>';$('craftResult').innerHTML=h}
function renderProcess(){const n=$('processName').value,r=record(n),want=qty('processQty');if(!r){$('processResult').innerHTML='<p class="warn">レシピ未登録</p>';return}let p=plan([[n,want]]);let steps=p.steps.filter(x=>x.n===n);$('processResult').innerHTML=`<h2>${esc(n)} × ${want}個</h2><p class="mini">${esc(r.source||'ユーザー編集')}</p>`+(steps.length?steps.map(s=>`<p class="good">加工 ${s.runs}回 ／ 完成 ${s.produced}個</p><div class="meta">${s.parts.map(x=>esc(x[0])+' × '+x[1]).join('、')}</div>`).join(''):p.unknown.length?'<p class="warn">必要数・完成数が未確認です。</p>':'<p class="good">在庫で足ります。</p>')+'<h2>不足原材料</h2>'+(Object.entries(p.raw).map(([x,v])=>`<div class="line row"><b>${esc(x)}</b><span>${v}個</span></div>`).join('')||'<p class="mini">計算できる不足原材料はありません。</p>')+(p.unknown.length?'<p class="warn">⚠️ '+p.unknown.map(esc).join('、')+'</p>':'')}
function loadEdit(){let r=record($('processName').value);$('ingredients').value=(r?.parts||[]).map(p=>p[0]+','+(p[1]??'')).join('\n');$('yieldQty').value=r?.yield??'';renderProcess()}
function saveRecipe(){let n=$('processName').value,lines=$('ingredients').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),parts=[];for(let line of lines){let a=line.split(/[,，]/),name=(a[0]||'').trim(),v=(a[1]||'').trim();if(!name||a.length>2||v&&!/^[1-9]\d*$/.test(v)){alert('材料は「素材名,必要数」の形式で入力してください');return}parts.push([name,v?Number(v):null])}let y=$('yieldQty').value.trim();if(y&&!/^[1-9]\d*$/.test(y)){alert('完成数は1以上の整数にしてください');return}saved.process[n]={parts,yield:y?Number(y):null,source:'ユーザー編集・要確認'};store();renderProcess();craft();search();alert('保存しました')}
function stock(){let q=$('stockQ').value.trim().toLowerCase();$('stockResults').innerHTML=names.filter(n=>n.toLowerCase().includes(q)).slice(0,q?200:50).map(n=>`<div class="panel row"><b>${esc(n)}</b><input type="number" min="0" aria-label="${esc(n)}の在庫" value="${Number(saved.stock[n]||0)}" onchange="setStock(decodeURIComponent('${encodeURIComponent(n)}'),this.value)"></div>`).join('')}
function setStock(n,v){saved.stock[n]=Math.max(0,Math.floor(Number(v)||0));store();craft();renderProcess();search()}
function loadMemo(){$('memo').value=saved.memo[$('memoName').value]||''}
function exportData(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}));a.href=url;a.download='マビノギ生産ナビ_バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function importData(e){let f=e.target.files?.[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(!x||typeof x.stock!=='object'||typeof x.memo!=='object'||Array.isArray(x.stock)||Array.isArray(x.memo))throw Error();saved={stock:x.stock||{},memo:x.memo||{},process:x.process||{}};store();stock();craft();loadEdit();loadMemo();search();alert('復元しました')}catch(err){alert('バックアップファイルを確認してください')}})}
$('craftName').innerHTML=C.map((r,i)=>`<option value="${i}">${esc(r[0])}｜${esc(r[1])}</option>`).join('');$('processName').innerHTML=Object.keys(R).sort((a,b)=>a.localeCompare(b,'ja')).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');$('memoName').innerHTML=[...new Set([...names,...C.map(x=>x[1])])].sort((a,b)=>a.localeCompare(b,'ja')).map(n=>`<option>${esc(n)}</option>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('q').oninput=search;$('craftName').onchange=craft;$('craftQty').oninput=craft;$('processName').onchange=loadEdit;$('processQty').oninput=renderProcess;$('saveRecipe').onclick=saveRecipe;$('stockQ').oninput=stock;$('memoName').onchange=loadMemo;$('saveMemo').onclick=()=>{saved.memo[$('memoName').value]=$('memo').value;store();alert('保存しました')};$('backup').onclick=exportData;$('restore').onchange=importData;search();craft();stock();loadEdit();loadMemo();
</script></body></html>
